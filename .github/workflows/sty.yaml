name: Starlark types

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sty:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workspace: [".", gazelle]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # https://github.com/tamird/sty/blob/dde5bd0bed02197684af7fa0aae86b4a2f5cdc0a/docs/github-actions.md
      - uses: tamird/sty@dde5bd0bed02197684af7fa0aae86b4a2f5cdc0a
        with:
          working-directory: ${{ matrix.workspace }}
          bazel-version: '8.8.1'
