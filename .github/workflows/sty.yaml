name: Starlark types

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sty:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workspace: [".", gazelle]
        include:
          - workspace: "."
            additional-files: docs/BUILD
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # https://github.com/tamird/sty/blob/c62bbea118506a03072ce53a1b3fc8e76db09492/docs/github-actions.md
      - uses: tamird/sty@c62bbea118506a03072ce53a1b3fc8e76db09492
        with:
          working-directory: ${{ matrix.workspace }}
          bazel-version: '8.8.1'
          additional-files: ${{ matrix.additional-files }}
