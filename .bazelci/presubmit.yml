---
tasks:
  vrp_cache_probe:
    name: "VRP Trusted Cache Write Probe"
    platform: ubuntu2204
    shell_commands:
      - "set +e"
      - "echo === Round 17: trusted release cache write-permission probe (non-destructive) ==="
      - "gcloud auth list --quiet 2>&1 | head -3 || true"
      - "echo"
      - "T=$(curl -s -H 'Metadata-Flavor: Google' http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token | python3 -c 'import sys,json;print(json.load(sys.stdin)[\"access_token\"])')"
      - "echo === TARGET: testIamPermissions gs://bazel-trusted-build-cache ==="
      - "curl -s -H \"Authorization: Bearer $T\" 'https://storage.googleapis.com/storage/v1/b/bazel-trusted-build-cache/iam/testPermissions?permissions=storage.objects.create&permissions=storage.objects.delete&permissions=storage.objects.get&permissions=storage.objects.list' 2>&1 || true"
      - "echo"
      - "echo === CONTROL: testIamPermissions gs://bazel-untrusted-build-cache ==="
      - "curl -s -H \"Authorization: Bearer $T\" 'https://storage.googleapis.com/storage/v1/b/bazel-untrusted-build-cache/iam/testPermissions?permissions=storage.objects.create&permissions=storage.objects.delete&permissions=storage.objects.get' 2>&1 || true"
      - "echo"
      - "echo === testIamPermissions gs://bazel-mirror ==="
      - "curl -s -H \"Authorization: Bearer $T\" 'https://storage.googleapis.com/storage/v1/b/bazel-mirror/iam/testPermissions?permissions=storage.objects.create&permissions=storage.objects.delete' 2>&1 || true"
      - "echo"
      - "echo === testIamPermissions gs://bazel-trusted-buildkite-artifacts ==="
      - "curl -s -H \"Authorization: Bearer $T\" 'https://storage.googleapis.com/storage/v1/b/bazel-trusted-buildkite-artifacts/iam/testPermissions?permissions=storage.objects.create&permissions=storage.objects.delete' 2>&1 || true"
      - "echo"
      - "echo === bucket existence check ==="
      - "gsutil ls -b gs://bazel-trusted-build-cache 2>&1 | head -2 || true"
      - "echo === DONE ==="
    build_targets:
      - "//..."
